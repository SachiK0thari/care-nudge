      - "The skin around my bug bite is hot and the redness doubled in size overnight."
      - "I have a wound that's oozing and the redness is creeping up my leg, plus chills."
  - id: shingles_eye
    level: URGENT
    area: eye
    concern: possible shingles affecting the eye
    flags: [painful blistering rash near the eye, rash on one side of the forehead]
    replies:
      - "A painful, blistering rash on one side of the forehead or around the eye can be shingles involving the eye, which can damage vision. Antiviral treatment works best when started early, so you should be seen today."
      - "A painful rash with blisters on one side of the forehead or near the eye can be shingles affecting the eye, which can harm your vision. Antiviral medicine works best when started early, so please be seen today."
      - "Blisters on one side of your forehead, around the eye, or on the tip of the nose can mean shingles is involving the eye, and that can threaten your sight. Early antiviral treatment matters, so you should be seen today."
    utterances:
      - "I have a burning, blistery rash on one side of my forehead and my eye is red."
      - "Painful blisters showed up on the tip of my nose and around my left eye."
      - "There's a tingling rash with little blisters above my right eyebrow, only on that side."
      - "One side of my forehead is covered in painful blisters and my eyelid is swelling."
