      - "My bowel habits changed a month ago and sometimes there's blood mixed in."
      - "There's been a little blood in my stool on and off for three weeks."
      - "I keep seeing streaks of red blood when I go to the bathroom and my stools are thinner."
      - "For the past month I've been constipated, which is new, and I saw blood twice."
