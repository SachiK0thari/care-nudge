# Seed catalog for the synthetic dataset. DEMO CONTENT - not clinically validated.
# Each scenario: 5 patient phrasings (first 3 -> train, last 2 -> held-out test).
# level: EMERGENCY (911 / ED now) | URGENT (seen today) | SOON (primary care within days) | ROUTINE

areas:
  eye:
    openers: ["Something is off with my eye.", "I've been having some trouble with my vision."]
    question: "What exactly are you noticing - flashes, floaters, pain, redness, or any loss of vision? And when did it start?"
  head:
    openers: ["I've got a headache I'm not sure about.", "My head has been bothering me."]
    question: "How did it start - suddenly or gradually - and do you have any fever, neck stiffness, weakness, or trouble speaking?"
  chest:
    openers: ["My chest feels weird.", "Something feels off when I breathe."]
    question: "Is there any pain or pressure, does it spread anywhere, and did it come on suddenly?"
  belly:
    openers: ["My stomach has been off.", "I have some belly trouble."]
    question: "Where is the pain, how severe is it, and have you noticed any blood, fever, or vomiting?"
  back:
    openers: ["My back is acting up.", "I hurt my back."]
    question: "Do you have any numbness, leg weakness, or changes in bladder or bowel control along with the pain?"
  skin:
    openers: ["I have a skin thing I keep meaning to ask about.", "There's a spot on my skin."]
    question: "Has it changed in size, shape, or color, and is there any pain, spreading redness, or fever?"
  general:
    openers: ["I haven't been feeling like myself lately.", "I have a health question."]
    question: "What symptoms are you noticing, how long has this been going on, and is anything getting worse?"

scenarios:
  # ------------------------------ EMERGENCY ------------------------------
  - id: heart_attack
    level: EMERGENCY
    area: chest
    concern: possible heart attack
    flags: [chest pressure or pain, pain spreading to arm or jaw, sweating or shortness of breath]
    replies:
      - "Chest pressure that spreads to the arm or jaw, especially with sweating or shortness of breath, can be a sign of a heart attack. Minutes matter here. Please call 911 now - do not drive yourself."
      - "Pressure or squeezing in the chest that spreads to your arm or jaw, particularly with sweating or breathlessness, can mean a heart attack. Every minute counts. Call 911 right now, and do not drive yourself to the hospital."
      - "What you're describing - chest pressure spreading toward your arm or jaw, with sweating or shortness of breath - can be a heart attack. This can't wait. Please call 911 now rather than driving yourself."
    utterances:
      - "There's a heavy pressure in the middle of my chest and it's going down my left arm."
      - "My chest feels tight like someone is sitting on it, and I'm sweating a lot."
      - "I've had squeezing chest pain for 20 minutes and my jaw aches too."
      - "Crushing feeling in my chest, short of breath, and I feel sick to my stomach."
      - "Pain in my chest keeps spreading to my shoulder and I'm clammy."
  - id: stroke
    level: EMERGENCY
    area: head
    concern: possible stroke or TIA
    flags: [face drooping, arm or leg weakness on one side, slurred speech]
    replies:
      - "Sudden face drooping, weakness on one side, or slurred speech can be a sign of a stroke - even if it has already gone away. Treatment is time-critical. Please call 911 now and note the time the symptoms started."
      - "A face that droops, weakness on one side of the body, or speech that suddenly slurs can be a stroke, even if it passes. Stroke treatment depends on speed. Call 911 right away and write down when the symptoms began."
      - "These can be stroke warning signs: one side of the face drooping, sudden one-sided weakness or numbness, or trouble getting words out. They still count even if they have stopped. Please call 911 now and note what time it started."
    utterances:
      - "My husband's face is drooping on one side and his words are slurred."
      - "My right arm suddenly went weak and I couldn't hold my coffee cup."
      - "For about ten minutes I couldn't get my words out and my hand was numb, but it's fine now."
      - "One side of my mouth is sagging and my speech sounds funny."
      - "My left leg and arm went numb all of a sudden and I feel confused."
  - id: thunderclap_headache
    level: EMERGENCY
    area: head
    concern: possible bleeding in the brain
    flags: [sudden severe headache, worst headache of life]
    replies:
      - "A headache that hits suddenly and is the worst of your life can be a sign of bleeding in the brain. This needs emergency evaluation right away. Please call 911 or have someone take you to the emergency department now."
      - "A sudden, severe headache that is the worst you've ever had can be caused by bleeding in the brain. It needs emergency care immediately. Call 911 now, or have someone drive you to the emergency department."
      - "When a headache comes on in seconds and is the worst of your life, bleeding in the brain has to be ruled out right away. Please call 911 or get someone to take you to the emergency department now - don't wait for it to ease."
    utterances:
      - "Out of nowhere I got the worst headache of my life, like being hit with a hammer."
      - "A sudden explosive headache started a few minutes ago and it's unbearable."
      - "I've never had a headache this bad - it came on in seconds."
      - "It felt like a thunderclap in my head and now my neck hurts too."
      - "Worst headache I have ever had, started instantly while I was lifting something."
  - id: anaphylaxis
    level: EMERGENCY
    area: chest
    concern: possible severe allergic reaction
    flags: [swelling of lips, tongue or throat, trouble breathing, hives after exposure]
    replies:
      - "Swelling of the lips, tongue, or throat with trouble breathing can be a severe allergic reaction. Use an epinephrine auto-injector if you have one and call 911 now."
      - "Swollen lips, tongue, or throat along with difficulty breathing can be anaphylaxis, a severe allergic reaction. If you have an epinephrine auto-injector, use it now, and call 911."
      - "Hives with wheezing, or swelling in your lips, tongue, or throat, can mean a severe allergic reaction that can close the airway. Use your epinephrine auto-injector if you carry one and call 911 right away."
    utterances:
      - "I ate shrimp and now my lips are swelling and my throat feels tight."
      - "I got stung by a bee and I'm breaking out in hives and wheezing."
      - "My tongue feels swollen and it's getting hard to breathe after taking a new antibiotic."
      - "My throat is closing up and my face is puffy after eating peanuts."
      - "Hives all over and I can't catch my breath since the wasp sting."
  - id: pulmonary_embolism
    level: EMERGENCY
    area: chest
    concern: possible blood clot in the lung
    flags: [sudden shortness of breath, sharp chest pain when breathing, recent surgery or long travel]
    replies:
      - "Sudden shortness of breath with sharp chest pain, especially after surgery or a long trip, can be a sign of a blood clot in the lung. Please call 911 or go to the emergency department now."
      - "Shortness of breath that comes on suddenly with sharp chest pain, particularly after surgery or long travel, can be a blood clot in the lung. Call 911 or go to the emergency department right away."
      - "A blood clot in the lung can cause sudden breathlessness and sharp pain when you breathe in, and recent surgery or a long trip raises that risk. This needs emergency care: please call 911 or go to the emergency department now."
    utterances:
      - "I suddenly can't catch my breath and it hurts to breathe in. I flew back from Asia two days ago."
      - "Since my knee surgery last week I've gotten very short of breath all of a sudden."
      - "Sharp pain in my chest when I inhale and my heart is racing out of nowhere."
      - "I'm suddenly winded just sitting here and I coughed up a little blood."
      - "Had a long road trip, now sudden trouble breathing and stabbing chest pain."
  - id: vision_loss
    level: EMERGENCY
    area: eye
    concern: possible retinal detachment or blocked blood vessel in the eye
    flags: [sudden vision loss, curtain or shadow over vision]
    replies:
      - "Sudden loss of vision or a curtain or shadow coming across your sight can mean the retina is detaching or blood flow to the eye is blocked. Vision can be lost permanently within hours. Please go to the emergency department now."
      - "Losing vision suddenly, or seeing a shadow or curtain move across your sight, can mean a detaching retina or a blocked blood vessel in the eye. Sight can be lost for good within hours, so please go to the emergency department now."
      - "A curtain, shadow, or sudden loss of sight in one eye is an eye emergency - it can come from retinal detachment or a blocked blood vessel. Waiting even a few hours can mean permanent vision loss. Please go to the emergency department right away."
    utterances:
      - "A dark curtain is coming down over the vision in my left eye."
      - "I suddenly can't see out of my right eye, and it doesn't hurt."
      - "There's a gray shadow covering half of what I see in one eye since this morning."
      - "My vision in one eye just went black for no reason."
      - "It looks like a veil is being pulled across my eye from the side."
  - id: gi_bleed
    level: EMERGENCY
    area: belly
    concern: possible bleeding in the stomach or intestines
    flags: [vomiting blood, black tarry stools]
    replies:
      - "Vomiting blood or passing black, tarry stools can be a sign of bleeding in the digestive tract, which can become serious quickly. Please go to the emergency department now, or call 911 if you feel faint."
      - "Blood in vomit, vomit that looks like coffee grounds, or black tarry stools can mean bleeding in the digestive tract, and that can get serious fast. Go to the emergency department now, and call 911 if you feel faint or dizzy."
      - "Throwing up blood or having black, sticky stools can be a sign of bleeding in the stomach or intestines. This needs emergency care now: please go to the emergency department, or call 911 if you feel lightheaded or faint."
    utterances:
      - "I just threw up and there was blood in it."
      - "My stools have been black and tarry and I feel lightheaded."
      - "I vomited something that looked like coffee grounds."
      - "There was a lot of dark red blood when I vomited this morning."
      - "Jet black sticky poop for two days and now I'm dizzy when I stand."
  - id: suicidal_thoughts
    level: EMERGENCY
    area: general
    concern: risk of self-harm
    flags: [thoughts of suicide or self-harm]
    replies:
      - "I'm really glad you told me, and I'm sorry you're carrying this. You deserve support right now: please call or text 988 (Suicide & Crisis Lifeline) to talk with someone, or call 911 if you are in immediate danger."
      - "Thank you for telling me - that took courage, and you don't have to handle this alone. Please call or text 988 (Suicide & Crisis Lifeline) now to talk with someone, or call 911 if you are in immediate danger."
      - "I'm so sorry you're feeling this way, and I'm glad you reached out. Right now, please call or text 988 (Suicide & Crisis Lifeline) - they are there to listen at any hour. If you are in immediate danger, call 911."
    utterances:
      - "I've been thinking about ending my life."
      - "I don't want to be alive anymore."
      - "Lately I keep thinking everyone would be better off without me and I've thought about how I'd do it."
      - "I feel like killing myself."
      - "I've been having thoughts of hurting myself and they're getting stronger."
  - id: cauda_equina
    level: EMERGENCY
    area: back
    concern: possible pressure on the spinal nerves
    flags: [numbness in groin or inner thighs, loss of bladder or bowel control, new leg weakness with back pain]
    replies:
      - "Back pain together with numbness in the groin, new leg weakness, or loss of bladder or bowel control can mean the nerves at the base of the spine are being compressed. Permanent damage can happen without fast treatment. Please go to the emergency department now."
      - "Numbness in the groin or inner thighs, new weakness in the legs, or losing bladder or bowel control along with back pain can mean the nerves at the bottom of the spine are being squeezed. Without fast treatment the damage can be permanent. Please go to the emergency department now."
      - "When back pain comes with numbness in the saddle area, legs that feel weak, or changes in bladder or bowel control, the spinal nerves may be under pressure. This needs emergency treatment to prevent lasting damage. Please go to the emergency department right away."
    utterances:
      - "My back pain got worse and now I'm numb between my legs and can't tell when I need to pee."
      - "Bad lower back pain and I just lost control of my bladder."
      - "Both my legs feel weak and the area I sit on is numb since my back went out."
      - "I can't feel myself wiping and my back is killing me."
      - "Since yesterday I've had back pain, my legs keep giving way, and I wet myself without feeling it."
  - id: infant_fever
    level: EMERGENCY
    area: general
    concern: possible serious infection in a young infant
    flags: [fever in a baby under 3 months]
    replies:
      - "A temperature of 100.4 F (38 C) or higher in a baby under 3 months can be a sign of a serious infection, even if the baby looks okay. Please take your baby to the emergency department now."
      - "In a baby younger than 3 months, a temperature of 100.4 F (38 C) or above can signal a serious infection, even when the baby seems fine. Please take your baby to the emergency department now."
      - "Babies under 3 months can't fight infection the way older children can, so a temperature of 100.4 F (38 C) or higher needs emergency care, even if your baby looks well. Please go to the emergency department now."
    utterances:
      - "My 6 week old has a temperature of 100.8."
      - "My newborn feels hot and the thermometer says 101."
      - "Our two month old has a fever of 100.5 and is sleepier than usual."
      - "My baby is 5 weeks old and running a fever of 38.3 C."
      - "3 week old with a rectal temp of 100.6 and not feeding well."
  # ------------------------------- URGENT --------------------------------
  - id: retinal_flashes
    level: URGENT
    area: eye
    concern: possible retinal tear or early retinal detachment
    flags: [new flashes of light, sudden increase in floaters]
    replies:
      - "New flashes of light or a sudden shower of floaters can be a sign of a retinal tear, which can lead to a detachment and permanent vision loss if it isn't treated quickly. You should have a dilated eye exam today. If a curtain or shadow appears or you lose vision, go to the emergency department right away."
      - "Seeing new flashes of light or a sudden burst of floaters can mean the retina has torn, and a tear can turn into a detachment with permanent vision loss. Please get a dilated eye exam today. If you see a curtain or shadow, or lose vision, go to the emergency department immediately."
      - "A sudden increase in floaters or new flashes of light can come from a retinal tear. Caught early it can be treated, but left alone it can lead to detachment and lasting vision loss. You should be examined today, and if a shadow or curtain appears or your vision drops, go to the emergency department right away."
    utterances:
      - "I keep seeing white flashes in front of my right eye."
      - "Since yesterday there are flashes of light at the edge of my vision and a bunch of new floaters."
      - "I suddenly have lots of little black specks floating in one eye."
      - "There are lightning streaks in the corner of my left eye when I move it."
      - "A shower of new floaters showed up today along with flickering lights in one eye."
  - id: dvt
    level: URGENT
    area: general
    concern: possible blood clot in the leg
    flags: [one-sided leg swelling, calf pain and warmth]
    replies:
      - "Swelling, pain, and warmth in one calf can be a sign of a blood clot in the leg, which can travel to the lungs. You should be examined today. If you develop chest pain or shortness of breath, call 911."
      - "A calf that is swollen, painful, and warm on one side only can be a blood clot in the leg, and a clot can travel to the lungs. Please be examined today. If you get chest pain or shortness of breath, call 911."
      - "One-sided leg swelling with calf pain and warmth can mean a deep vein blood clot, which can break off and reach the lungs. This should be checked today. Call 911 if you develop chest pain or trouble breathing."
    utterances:
      - "My left calf is swollen, warm, and sore, and the other leg is fine."
      - "One leg is noticeably bigger than the other and the calf hurts when I walk."
      - "My right lower leg has been red and puffy and tender since my long flight."
      - "Only my left leg is swollen and it aches deep in the calf."
      - "My calf is tight, warm, and painful on one side after being laid up for a week."
  - id: sudden_hearing_loss
    level: URGENT
    area: general
    concern: possible sudden sensorineural hearing loss
    flags: [sudden hearing loss in one ear]
    replies:
      - "Hearing that drops suddenly in one ear can be an inner-ear emergency, and treatment works best when it starts within the first few days. You should be seen today rather than waiting to see if it clears."
      - "Sudden hearing loss in one ear can be an inner-ear emergency, and treatment is most effective when it begins within the first few days. Please be seen today instead of waiting for it to come back on its own."
      - "When hearing drops out suddenly in one ear, the inner ear or its nerve may be affected, and the window for treatment is short. You should be seen today - this is not something to sit out."
    utterances:
      - "I woke up and I can barely hear out of my left ear."
      - "My right ear suddenly went muffled yesterday and now it's ringing."
      - "All of a sudden I lost most of the hearing in one ear."
      - "One ear just went deaf this morning, no pain or cold."
      - "Hearing in my left ear dropped out of nowhere and everything sounds far away."
  - id: kidney_infection
    level: URGENT
    area: belly
    concern: possible kidney infection
    flags: [fever with flank or back pain, burning with urination]
    replies:
      - "Fever with pain in your side or back and burning when you urinate can mean a bladder infection has reached the kidney. This needs treatment today. If you can't keep fluids down or feel confused or faint, go to the emergency department."
      - "Burning when you urinate plus fever and pain in your side or back can mean the infection has spread up to the kidney. This needs treatment today. If you can't keep fluids down, or you feel confused or faint, go to the emergency department."
      - "A urinary infection with fever, chills, or pain in your flank can mean it has reached the kidney, and that needs treatment today. Go to the emergency department if you are vomiting and can't keep fluids down, or if you feel confused or faint."
    utterances:
      - "It burns when I pee and now I have a fever and pain in my right side."
      - "I've had a UTI for a few days and now my back hurts under my ribs and I have chills."
      - "Fever of 102, aching in my flank, and I'm peeing constantly."
      - "Shaking chills and a deep ache on one side of my back, plus painful urination."
      - "My urine is cloudy, it stings, and since last night I've had a fever and side pain."
  - id: cellulitis
    level: URGENT
    area: skin
    concern: possible spreading skin infection
    flags: [spreading redness and warmth, red streaks, fever with a skin wound]
    replies:
      - "Redness that is spreading, feels warm, or has red streaks - especially with fever - can be a skin infection moving into deeper tissue. It should be looked at and treated today."
      - "Skin redness that keeps spreading, feels warm, or has red streaks, particularly with a fever, can be an infection moving deeper into the tissue. It needs to be looked at and treated today."
      - "When redness around a wound grows, feels hot, or sends red streaks up the limb - especially if you have a fever or chills - the infection may be spreading. Please be seen today so it can be treated."
    utterances:
