  # -------------------------------- SOON ---------------------------------
  - id: changing_mole
    level: SOON
    area: skin
    concern: possible skin cancer
    flags: [mole changing in size, shape or color]
    replies:
      - "A mole that is changing in size, shape, or color, or that bleeds or itches, should be checked because it can be an early sign of skin cancer. It isn't an emergency, but please don't put it off - book a visit within the next week or two."
      - "Moles that grow, change color, itch, or bleed need to be looked at, since those changes can be an early sign of skin cancer. This isn't an emergency, but it shouldn't wait for months: please book a visit in the next week or two."
      - "Any mole that grows, changes shape or color, or starts to itch or bleed is worth having checked, because those can be early signs of skin cancer. It's not an emergency, but please book a visit in the next week or two rather than leaving it."
    utterances:
      - "A mole on my back has gotten bigger and darker over the last few months."
      - "I have a spot on my arm with uneven edges that now has two colors."
      - "My mole started itching and bled a little when I touched it."
      - "The mole on my shoulder used to be round and now it looks lopsided."
      - "My partner says the dark spot on my back has grown and the border looks jagged."
