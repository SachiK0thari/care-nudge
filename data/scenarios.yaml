      - "Blood in your stool or a change in bowel habits that sticks around is usually from something minor, but it can also be an early sign of bowel disease, including cancer. Please book a primary care visit within the next few days to get it checked."
      - "Seeing blood when you go to the bathroom, or a bowel pattern that has changed and stayed changed, should be checked. Most causes are minor, but some are not, including bowel cancer. Please book a visit with your primary care team in the next few days."
    utterances:
